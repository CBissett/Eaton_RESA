
<!doctype html>
            
<html lang="en">

<head>
<meta charset="utf-8">
<title>Position</title>
<style>
    body{background: #CFBAF0;
    Color: #98F5E1;}
    p{color:#8EECF5;}
    div{
        width:150px;
        height:150px;
        background: pink;
        outline: solid 5px black;}
    
    #one{
        position:static;}

    #two{ 
        position:relative;
        left:100px;
        top:-50px;}

    #three{
        position:absolute;
        background:rgb(253, 253, 191);
        left: 200px;}

    #four{
        position:fixed;
        background: rgb(147, 147, 244);
        right:0;}

    #five{
        position:sticky;
        background: rgb(243, 203, 131);
        top:0;

    }


</style>
</head>
            
<body>

<div id="five"></div>

<div id="one"></div>

<div id="two"></div>

<div id="three"></div>

<div id="four"> </div>


<p></p><a href="index.html">GET OUT OF MY SWAMP</a></p>

</body>

</html>
