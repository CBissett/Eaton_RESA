<!doctype html>

<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Transition</title>
    <style>
        body{background:rgb(232, 182, 189)}
        
        div{margin-bottom:50px;
        }
        #two {
            width:100px;
            height:100px;
            background:rgb(255, 143, 231);
            Border:2px solid rgb(164, 164, 242);
        transition:transform 1s}

        #two:hover{ transform: matrix(1, -0.3, 0, 1, 0, 0);
        background:rgb(3, 3, 227)}

    #one{width:100px;
            height:100px;
            background:rgb(179, 38, 198);
            Border:2px solid rgb(98, 96, 248);
        transition:transform 2s}

    #one:hover{transform: rotateX(150deg);
    background:rgb(4, 4, 218)}

    #three{width:100px;
            height:100px;
            background:rgb(124, 19, 133);
            Border:2px solid rgb(20, 20, 167);
        transition:transform 2s}

    #three:hover{transform: rotateY(150deg);
    background:rgb(1, 1, 157);}

    #four{width:100px;
            height:100px;
            background:rgb(97, 6, 113);
            Border:2px solid rgb(0, 0, 103);
        transition:transform 1s;}

    #four:hover{Transform:rotate(400deg)scale(3);
    background:rgb(0, 0, 128)}
    </style>
</head>

<body>
    <p>Hover over a box to see it move.</p>
    <div id="two"></div>
    <div id="one"></div>
    <div id="three"></div>
    <div id="four"></div>
    <a class="one" href="index.html">BYE BYE</a>
</body>

</html>
